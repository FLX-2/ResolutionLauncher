<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolution Launcher</title>
    <link rel="stylesheet" href="resolution_launcher_theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .launcher-container {
            background: var(--card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-2xl);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #00b894);
            padding: 1.5rem 2rem;
            color: var(--primary-foreground);
            font-weight: 600;
            font-size: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-controls {
            display: flex;
            gap: 0.5rem;
        }

        .window-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .window-btn:hover {
            transform: scale(1.1);
        }

        .close { background: #ff5f57; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #28ca42; }

        .content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .section {
            background: var(--secondary);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .section:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon {
            font-size: 1.2rem;
        }

        .file-input-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .file-path {
            flex: 1;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            color: var(--foreground);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .browse-btn {
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .browse-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .browse-btn:active {
            transform: translateY(0);
        }

        .resolution-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.75rem;
        }

        .resolution-btn {
            background: var(--input);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .resolution-btn:hover {
            border-color: var(--primary);
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .resolution-btn.active {
            background: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary-foreground);
            font-size: 12px;
            font-weight: bold;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .uwp-input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            color: var(--foreground);
            font-family: var(--font-mono);
            margin-top: 0.5rem;
        }

        .profile-input-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .profile-input {
            flex: 1;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            color: var(--foreground);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .secondary-btn {
            background: var(--secondary);
            color: var(--foreground);
            border: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .secondary-btn:hover {
            background: var(--muted);
            border-color: var(--primary);
        }

        .launch-btn {
            background: linear-gradient(135deg, var(--primary), #00b894);
            color: var(--primary-foreground);
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .launch-btn:active {
            transform: translateY(0);
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .launch-btn:hover::before {
            left: 100%;
        }

        .hidden {
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="launcher-container">
        <div class="header">
            <span>Resolution Launcher</span>
            <div class="window-controls">
                <button class="window-btn minimize"></button>
                <button class="window-btn maximize"></button>
                <button class="window-btn close"></button>
            </div>
        </div>
        
        <div class="content">
            <!-- Application Selection -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">📁</span>
                    Select Application
                </div>
                <div class="file-input-group">
                    <input type="text" class="file-path" placeholder="C:\Path\To\Your\Application.exe" value="C:\Games\MyGame.exe">
                    <button class="browse-btn">Browse...</button>
                </div>
            </div>

            <!-- Resolution Selection -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">🖥️</span>
                    Select Resolution
                </div>
                <div class="resolution-grid">
                    <button class="resolution-btn active">1920×1080</button>
                    <button class="resolution-btn">2560×1440</button>
                    <button class="resolution-btn">3840×2160</button>
                    <button class="resolution-btn">1600×900</button>
                    <button class="resolution-btn">Custom</button>
                </div>
            </div>

            <!-- Launch Options -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">⚙️</span>
                    Launch Options
                </div>
                <div class="options-grid">
                    <div class="checkbox-group">
                        <div class="checkbox checked"></div>
                        <label>Borderless Window</label>
                    </div>
                    <div class="checkbox-group">
                        <div class="checkbox"></div>
                        <label>Disable DPI Scaling</label>
                    </div>
                    <div class="checkbox-group">
                        <div class="checkbox"></div>
                        <label>Run as Administrator</label>
                    </div>
                    <div class="checkbox-group">
                        <div class="checkbox"></div>
                        <label>Custom Arguments</label>
                    </div>
                </div>
            </div>

            <!-- UWP Application -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">🎯</span>
                    UWP Application
                </div>
                <div class="checkbox-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="uwp-toggle">
                        <span class="slider"></span>
                    </label>
                    <label>Use UWP Path</label>
                </div>
                <input type="text" class="uwp-input hidden" placeholder="microsoft.minecraftuwp://" value="microsoft.minecraftuwp://">
            </div>

            <!-- Save Configuration -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">💾</span>
                    Save Configuration
                </div>
                <div class="profile-input-group">
                    <input type="text" class="profile-input" placeholder="Profile Name" value="Default Game Settings">
                    <div class="action-buttons">
                        <button class="secondary-btn">Save Profile</button>
                        <button class="secondary-btn">Create Desktop Shortcut</button>
                    </div>
                </div>
            </div>

            <button class="launch-btn">
                🚀 Launch Application
            </button>
        </div>
    </div>

    <script>
        // Interactive functionality for demo
        document.querySelectorAll('.resolution-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.resolution-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.querySelectorAll('.checkbox').forEach(checkbox => {
            checkbox.addEventListener('click', function() {
                this.classList.toggle('checked');
            });
        });

        document.getElementById('uwp-toggle').addEventListener('change', function() {
            const uwpInput = document.querySelector('.uwp-input');
            if (this.checked) {
                uwpInput.classList.remove('hidden');
            } else {
                uwpInput.classList.add('hidden');
            }
        });

        document.querySelector('.launch-btn').addEventListener('click', function() {
            this.innerHTML = '⏳ Launching...';
            this.disabled = true;
            
            setTimeout(() => {
                this.innerHTML = '✅ Launched Successfully!';
                setTimeout(() => {
                    this.innerHTML = '🚀 Launch Application';
                    this.disabled = false;
                }, 2000);
            }, 2000);
        });
    </script>
</body>
</html>
